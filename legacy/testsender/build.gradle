plugins { id 'com.android.application' }

android {
    namespace 'com.guchnn.focusreturn.testsender'
    compileSdk 35

    defaultConfig {
        applicationId 'com.guchnn.focusreturn.testsender'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release { signingConfig signingConfigs.debug }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FocusReturn-TestSender-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}
